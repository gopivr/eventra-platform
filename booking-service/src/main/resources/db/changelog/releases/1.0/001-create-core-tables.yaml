databaseChangeLog:
  - changeSet:
      id: booking-1.0-001-core
      author: eventra
      changes:
        - sql:
            sql: |
              CREATE TABLE ${schemaName}.ticket_product (id UUID PRIMARY KEY, event_id UUID NOT NULL, name VARCHAR(200) NOT NULL, quantity_total INTEGER NOT NULL, quantity_sold INTEGER NOT NULL DEFAULT 0, active BOOLEAN NOT NULL DEFAULT TRUE, CONSTRAINT ticket_product_quantity_ck CHECK (quantity_total >= 0 AND quantity_sold >= 0 AND quantity_sold <= quantity_total));
              CREATE TABLE ${schemaName}.ticket_product_price (id UUID PRIMARY KEY, product_id UUID NOT NULL REFERENCES ${schemaName}.ticket_product(id), amount_minor BIGINT NOT NULL, currency VARCHAR(3) NOT NULL, valid_from TIMESTAMP WITH TIME ZONE NOT NULL, valid_until TIMESTAMP WITH TIME ZONE, CONSTRAINT ticket_price_amount_ck CHECK (amount_minor >= 0), CONSTRAINT ticket_price_period_ck CHECK (valid_until IS NULL OR valid_until > valid_from));
              CREATE TABLE ${schemaName}.seat_map (id UUID PRIMARY KEY, event_id UUID NOT NULL UNIQUE, name VARCHAR(200) NOT NULL);
              CREATE TABLE ${schemaName}.seat_section (id UUID PRIMARY KEY, seat_map_id UUID NOT NULL REFERENCES ${schemaName}.seat_map(id), name VARCHAR(100) NOT NULL, UNIQUE (seat_map_id, name));
              CREATE TABLE ${schemaName}.seat (id UUID PRIMARY KEY, section_id UUID NOT NULL REFERENCES ${schemaName}.seat_section(id), seat_label VARCHAR(50) NOT NULL, UNIQUE (section_id, seat_label));
              CREATE TABLE ${schemaName}.inventory_allocation (id UUID PRIMARY KEY, event_id UUID NOT NULL, product_id UUID REFERENCES ${schemaName}.ticket_product(id), seat_id UUID REFERENCES ${schemaName}.seat(id), state VARCHAR(20) NOT NULL, hold_id UUID, order_id UUID, version BIGINT NOT NULL DEFAULT 0, CONSTRAINT inventory_state_ck CHECK (state IN ('AVAILABLE','HELD','SOLD')));
              CREATE TABLE ${schemaName}.seat_hold (id UUID PRIMARY KEY, user_id UUID NOT NULL, event_id UUID NOT NULL, status VARCHAR(20) NOT NULL, expires_at TIMESTAMP WITH TIME ZONE NOT NULL, created_at TIMESTAMP WITH TIME ZONE NOT NULL, CONSTRAINT hold_status_ck CHECK (status IN ('ACTIVE','RELEASED','EXPIRED','CONVERTED')));
              CREATE TABLE ${schemaName}.seat_hold_item (hold_id UUID NOT NULL REFERENCES ${schemaName}.seat_hold(id), seat_id UUID NOT NULL REFERENCES ${schemaName}.seat(id), PRIMARY KEY (hold_id, seat_id));
              CREATE TABLE ${schemaName}.ticket_order (id UUID PRIMARY KEY, user_id UUID NOT NULL, event_id UUID NOT NULL, idempotency_key VARCHAR(200) NOT NULL, status VARCHAR(30) NOT NULL, currency VARCHAR(3) NOT NULL, subtotal_minor BIGINT NOT NULL, tax_minor BIGINT NOT NULL, fee_minor BIGINT NOT NULL, total_minor BIGINT NOT NULL, pricing_snapshot JSONB NOT NULL, created_at TIMESTAMP WITH TIME ZONE NOT NULL, version BIGINT NOT NULL DEFAULT 0, UNIQUE (user_id, idempotency_key), CONSTRAINT order_money_ck CHECK (subtotal_minor >= 0 AND tax_minor >= 0 AND fee_minor >= 0 AND total_minor = subtotal_minor + tax_minor + fee_minor), CONSTRAINT order_status_ck CHECK (status IN ('DRAFT','PENDING_PAYMENT','CONFIRMED','PAYMENT_FAILED','CANCELLATION_PENDING','CANCELLED','FULFILLED')));
              CREATE TABLE ${schemaName}.ticket_order_item (id UUID PRIMARY KEY, order_id UUID NOT NULL REFERENCES ${schemaName}.ticket_order(id), product_id UUID, seat_id UUID, quantity INTEGER NOT NULL, unit_amount_minor BIGINT NOT NULL, CONSTRAINT order_item_ck CHECK (quantity > 0 AND unit_amount_minor >= 0));
              CREATE TABLE ${schemaName}.ticket_assignment (id UUID PRIMARY KEY, order_item_id UUID NOT NULL REFERENCES ${schemaName}.ticket_order_item(id), assignee_user_id UUID, assignee_name VARCHAR(200));
              CREATE TABLE ${schemaName}.ticket (id UUID PRIMARY KEY, order_id UUID NOT NULL REFERENCES ${schemaName}.ticket_order(id), order_item_id UUID NOT NULL REFERENCES ${schemaName}.ticket_order_item(id), status VARCHAR(20) NOT NULL, issued_at TIMESTAMP WITH TIME ZONE, CONSTRAINT ticket_status_ck CHECK (status IN ('ISSUED','CHECKED_IN','VOIDED','REFUNDED')));
              CREATE TABLE ${schemaName}.admission_credential (ticket_id UUID PRIMARY KEY REFERENCES ${schemaName}.ticket(id), token_hash VARCHAR(64) NOT NULL UNIQUE, created_at TIMESTAMP WITH TIME ZONE NOT NULL);
              CREATE TABLE ${schemaName}.check_in (id UUID PRIMARY KEY, ticket_id UUID NOT NULL UNIQUE REFERENCES ${schemaName}.ticket(id), event_id UUID NOT NULL, scanner_subject VARCHAR(255) NOT NULL, checked_in_at TIMESTAMP WITH TIME ZONE NOT NULL);
              CREATE TABLE ${schemaName}.invitation (id UUID PRIMARY KEY, event_id UUID NOT NULL, inviter_user_id UUID NOT NULL, invitee_email VARCHAR(320) NOT NULL, token_hash VARCHAR(64) NOT NULL UNIQUE, status VARCHAR(20) NOT NULL, expires_at TIMESTAMP WITH TIME ZONE NOT NULL, created_at TIMESTAMP WITH TIME ZONE NOT NULL);
              CREATE TABLE ${schemaName}.service_request (id UUID PRIMARY KEY, event_id UUID NOT NULL, requester_user_id UUID NOT NULL, state VARCHAR(30) NOT NULL, expires_at TIMESTAMP WITH TIME ZONE NOT NULL, details JSONB NOT NULL, created_at TIMESTAMP WITH TIME ZONE NOT NULL);
              CREATE TABLE ${schemaName}.service_request_target (request_id UUID NOT NULL REFERENCES ${schemaName}.service_request(id), provider_id UUID NOT NULL, PRIMARY KEY (request_id, provider_id));
              CREATE TABLE ${schemaName}.quote (id UUID PRIMARY KEY, request_id UUID NOT NULL REFERENCES ${schemaName}.service_request(id), provider_id UUID NOT NULL, amount_minor BIGINT NOT NULL, currency VARCHAR(3) NOT NULL, status VARCHAR(20) NOT NULL, expires_at TIMESTAMP WITH TIME ZONE NOT NULL, created_at TIMESTAMP WITH TIME ZONE NOT NULL, CONSTRAINT quote_amount_ck CHECK (amount_minor >= 0));
              CREATE TABLE ${schemaName}.service_booking (id UUID PRIMARY KEY, request_id UUID NOT NULL REFERENCES ${schemaName}.service_request(id), quote_id UUID NOT NULL REFERENCES ${schemaName}.quote(id), state VARCHAR(40) NOT NULL, created_at TIMESTAMP WITH TIME ZONE NOT NULL);
              CREATE TABLE ${schemaName}.provider_availability (id UUID PRIMARY KEY, provider_id UUID NOT NULL, starts_at TIMESTAMP WITH TIME ZONE NOT NULL, ends_at TIMESTAMP WITH TIME ZONE NOT NULL, available BOOLEAN NOT NULL, CONSTRAINT availability_time_ck CHECK (ends_at > starts_at));
              CREATE TABLE ${schemaName}.cancellation (id UUID PRIMARY KEY, order_id UUID, service_booking_id UUID, requested_by UUID NOT NULL, reason VARCHAR(500), status VARCHAR(30) NOT NULL, created_at TIMESTAMP WITH TIME ZONE NOT NULL, CONSTRAINT cancellation_target_ck CHECK ((order_id IS NOT NULL) <> (service_booking_id IS NOT NULL)));
              CREATE TABLE ${schemaName}.booking_status_history (id UUID PRIMARY KEY, aggregate_type VARCHAR(40) NOT NULL, aggregate_id UUID NOT NULL, from_status VARCHAR(40), to_status VARCHAR(40) NOT NULL, changed_at TIMESTAMP WITH TIME ZONE NOT NULL);
