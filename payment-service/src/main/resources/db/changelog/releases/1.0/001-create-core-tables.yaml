databaseChangeLog:
  - changeSet:
      id: payment-1.0-001-core
      author: eventra
      changes:
        - sql:
            sql: |
              CREATE TABLE ${schemaName}.payment_intent (id UUID PRIMARY KEY, payer_reference VARCHAR(100) NOT NULL, order_reference VARCHAR(100) NOT NULL, amount_minor BIGINT NOT NULL, currency VARCHAR(3) NOT NULL, status VARCHAR(30) NOT NULL, idempotency_key VARCHAR(200) NOT NULL, created_at TIMESTAMP WITH TIME ZONE NOT NULL, UNIQUE (payer_reference, idempotency_key), CONSTRAINT payment_intent_amount_ck CHECK (amount_minor > 0));
              CREATE TABLE ${schemaName}.payment_attempt (id UUID PRIMARY KEY, payment_intent_id UUID NOT NULL REFERENCES ${schemaName}.payment_intent(id), provider VARCHAR(60) NOT NULL, provider_payment_reference VARCHAR(255), status VARCHAR(30) NOT NULL, amount_minor BIGINT NOT NULL, attempted_at TIMESTAMP WITH TIME ZONE NOT NULL, CONSTRAINT payment_attempt_amount_ck CHECK (amount_minor > 0));
              CREATE TABLE ${schemaName}.payment_method_reference (id UUID PRIMARY KEY, payer_reference VARCHAR(100) NOT NULL, provider VARCHAR(60) NOT NULL, provider_token VARCHAR(500) NOT NULL, masked_display VARCHAR(40) NOT NULL, created_at TIMESTAMP WITH TIME ZONE NOT NULL);
              CREATE TABLE ${schemaName}.coupon (id UUID PRIMARY KEY, code VARCHAR(80) NOT NULL UNIQUE, discount_type VARCHAR(20) NOT NULL, discount_value BIGINT NOT NULL, currency VARCHAR(3), active BOOLEAN NOT NULL DEFAULT TRUE, valid_from TIMESTAMP WITH TIME ZONE NOT NULL, valid_until TIMESTAMP WITH TIME ZONE, CONSTRAINT coupon_value_ck CHECK (discount_value >= 0));
              CREATE TABLE ${schemaName}.coupon_redemption (id UUID PRIMARY KEY, coupon_id UUID NOT NULL REFERENCES ${schemaName}.coupon(id), user_reference VARCHAR(100) NOT NULL, payment_intent_id UUID NOT NULL REFERENCES ${schemaName}.payment_intent(id), redeemed_at TIMESTAMP WITH TIME ZONE NOT NULL, UNIQUE (coupon_id, user_reference));
              CREATE TABLE ${schemaName}.pricing_adjustment (id UUID PRIMARY KEY, payment_intent_id UUID NOT NULL REFERENCES ${schemaName}.payment_intent(id), adjustment_type VARCHAR(30) NOT NULL, amount_minor BIGINT NOT NULL, reason VARCHAR(300) NOT NULL, CONSTRAINT adjustment_amount_ck CHECK (amount_minor >= 0));
              CREATE TABLE ${schemaName}.refund (id UUID PRIMARY KEY, payment_intent_id UUID NOT NULL REFERENCES ${schemaName}.payment_intent(id), idempotency_key VARCHAR(200) NOT NULL, amount_minor BIGINT NOT NULL, currency VARCHAR(3) NOT NULL, status VARCHAR(30) NOT NULL, provider_reference VARCHAR(255), requested_at TIMESTAMP WITH TIME ZONE NOT NULL, UNIQUE (payment_intent_id, idempotency_key), CONSTRAINT refund_amount_ck CHECK (amount_minor > 0));
              CREATE TABLE ${schemaName}.ledger_account (id UUID PRIMARY KEY, account_code VARCHAR(100) NOT NULL UNIQUE, owner_reference VARCHAR(100), currency VARCHAR(3) NOT NULL, account_type VARCHAR(30) NOT NULL);
              CREATE TABLE ${schemaName}.journal_entry (id UUID PRIMARY KEY, reference_type VARCHAR(80) NOT NULL, reference_id VARCHAR(100) NOT NULL, status VARCHAR(20) NOT NULL, posted_at TIMESTAMP WITH TIME ZONE, created_at TIMESTAMP WITH TIME ZONE NOT NULL, UNIQUE (reference_type, reference_id), CONSTRAINT journal_status_ck CHECK (status IN ('DRAFT','POSTED','REVERSED')));
              CREATE TABLE ${schemaName}.journal_line (id UUID PRIMARY KEY, journal_entry_id UUID NOT NULL REFERENCES ${schemaName}.journal_entry(id), ledger_account_id UUID NOT NULL REFERENCES ${schemaName}.ledger_account(id), debit_minor BIGINT NOT NULL DEFAULT 0, credit_minor BIGINT NOT NULL DEFAULT 0, currency VARCHAR(3) NOT NULL, CONSTRAINT journal_line_amount_ck CHECK ((debit_minor > 0 AND credit_minor = 0) OR (credit_minor > 0 AND debit_minor = 0)));
              CREATE TABLE ${schemaName}.settlement (id UUID PRIMARY KEY, beneficiary_reference VARCHAR(100) NOT NULL, status VARCHAR(30) NOT NULL, currency VARCHAR(3) NOT NULL, amount_minor BIGINT NOT NULL, created_at TIMESTAMP WITH TIME ZONE NOT NULL, CONSTRAINT settlement_amount_ck CHECK (amount_minor >= 0));
              CREATE TABLE ${schemaName}.settlement_line (id UUID PRIMARY KEY, settlement_id UUID NOT NULL REFERENCES ${schemaName}.settlement(id), journal_entry_id UUID NOT NULL REFERENCES ${schemaName}.journal_entry(id), amount_minor BIGINT NOT NULL, CONSTRAINT settlement_line_amount_ck CHECK (amount_minor >= 0));
              CREATE TABLE ${schemaName}.payout (id UUID PRIMARY KEY, settlement_id UUID NOT NULL REFERENCES ${schemaName}.settlement(id), beneficiary_reference VARCHAR(100) NOT NULL, idempotency_key VARCHAR(200) NOT NULL, provider_reference VARCHAR(255), status VARCHAR(30) NOT NULL, fee_minor BIGINT NOT NULL DEFAULT 0, requested_at TIMESTAMP WITH TIME ZONE NOT NULL, UNIQUE (beneficiary_reference, idempotency_key), CONSTRAINT payout_fee_ck CHECK (fee_minor >= 0));
              CREATE TABLE ${schemaName}.webhook_event (id UUID PRIMARY KEY, provider VARCHAR(60) NOT NULL, provider_event_id VARCHAR(255) NOT NULL, signature_verified BOOLEAN NOT NULL, payload JSONB NOT NULL, received_at TIMESTAMP WITH TIME ZONE NOT NULL, UNIQUE (provider, provider_event_id));
              CREATE TABLE ${schemaName}.reconciliation_run (id UUID PRIMARY KEY, provider VARCHAR(60) NOT NULL, started_at TIMESTAMP WITH TIME ZONE NOT NULL, completed_at TIMESTAMP WITH TIME ZONE, status VARCHAR(30) NOT NULL, result JSONB);
