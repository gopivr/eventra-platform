databaseChangeLog:
  - changeSet:
      id: catalog-1.0-001-core
      author: eventra
      changes:
        - sql:
            sql: |
              CREATE TABLE ${schemaName}.event (id UUID PRIMARY KEY, organizer_organization_id UUID NOT NULL, title VARCHAR(240) NOT NULL, description TEXT, status VARCHAR(30) NOT NULL, visibility VARCHAR(20) NOT NULL, starts_at TIMESTAMP WITH TIME ZONE NOT NULL, ends_at TIMESTAMP WITH TIME ZONE NOT NULL, timezone VARCHAR(100) NOT NULL, location_id UUID, version BIGINT NOT NULL DEFAULT 0, created_at TIMESTAMP WITH TIME ZONE NOT NULL, updated_at TIMESTAMP WITH TIME ZONE NOT NULL, CONSTRAINT event_time_ck CHECK (ends_at > starts_at), CONSTRAINT event_status_ck CHECK (status IN ('DRAFT','PUBLISHED','CANCELLED','COMPLETED')), CONSTRAINT event_visibility_ck CHECK (visibility IN ('PUBLIC','PRIVATE')));
              CREATE TABLE ${schemaName}.event_status_history (id UUID PRIMARY KEY, event_id UUID NOT NULL REFERENCES ${schemaName}.event(id), from_status VARCHAR(30), to_status VARCHAR(30) NOT NULL, changed_by VARCHAR(255) NOT NULL, changed_at TIMESTAMP WITH TIME ZONE NOT NULL);
              CREATE TABLE ${schemaName}.event_category (event_id UUID NOT NULL REFERENCES ${schemaName}.event(id), category_code VARCHAR(80) NOT NULL, PRIMARY KEY (event_id, category_code));
              CREATE TABLE ${schemaName}.event_media (id UUID PRIMARY KEY, event_id UUID NOT NULL REFERENCES ${schemaName}.event(id), object_storage_key VARCHAR(500) NOT NULL, media_type VARCHAR(30) NOT NULL, sort_order INTEGER NOT NULL DEFAULT 0, created_at TIMESTAMP WITH TIME ZONE NOT NULL);
              CREATE TABLE ${schemaName}.event_location (id UUID PRIMARY KEY, event_id UUID NOT NULL UNIQUE REFERENCES ${schemaName}.event(id), venue_id UUID, address_snapshot JSONB NOT NULL, city VARCHAR(120) NOT NULL, country_code CHAR(2) NOT NULL);
              CREATE TABLE ${schemaName}.venue (id UUID PRIMARY KEY, owner_organization_id UUID NOT NULL, name VARCHAR(240) NOT NULL, status VARCHAR(30) NOT NULL, address JSONB NOT NULL, city VARCHAR(120) NOT NULL, capacity INTEGER, created_at TIMESTAMP WITH TIME ZONE NOT NULL, updated_at TIMESTAMP WITH TIME ZONE NOT NULL, version BIGINT NOT NULL DEFAULT 0, CONSTRAINT venue_status_ck CHECK (status IN ('ACTIVE','INACTIVE')), CONSTRAINT venue_capacity_ck CHECK (capacity IS NULL OR capacity > 0));
              CREATE TABLE ${schemaName}.venue_amenity (id UUID PRIMARY KEY, code VARCHAR(80) NOT NULL UNIQUE, display_name VARCHAR(120) NOT NULL);
              CREATE TABLE ${schemaName}.venue_amenity_assignment (venue_id UUID NOT NULL REFERENCES ${schemaName}.venue(id), amenity_id UUID NOT NULL REFERENCES ${schemaName}.venue_amenity(id), PRIMARY KEY (venue_id, amenity_id));
              CREATE TABLE ${schemaName}.provider_profile (id UUID PRIMARY KEY, owner_organization_id UUID NOT NULL UNIQUE, display_name VARCHAR(240) NOT NULL, verification_status VARCHAR(30) NOT NULL, active BOOLEAN NOT NULL DEFAULT TRUE, bio TEXT, created_at TIMESTAMP WITH TIME ZONE NOT NULL, updated_at TIMESTAMP WITH TIME ZONE NOT NULL);
              CREATE TABLE ${schemaName}.service_category (id UUID PRIMARY KEY, code VARCHAR(80) NOT NULL UNIQUE, display_name VARCHAR(120) NOT NULL);
              CREATE TABLE ${schemaName}.provider_service (id UUID PRIMARY KEY, provider_id UUID NOT NULL REFERENCES ${schemaName}.provider_profile(id), category_id UUID REFERENCES ${schemaName}.service_category(id), name VARCHAR(240) NOT NULL, pricing_model VARCHAR(30) NOT NULL, base_amount_minor BIGINT NOT NULL, currency CHAR(3) NOT NULL, active BOOLEAN NOT NULL DEFAULT TRUE, CONSTRAINT provider_service_amount_ck CHECK (base_amount_minor >= 0), CONSTRAINT provider_service_pricing_ck CHECK (pricing_model IN ('FLAT','PER_HOUR','PER_DAY','PER_GUEST','PER_PLATE','CUSTOM_QUOTE')));
              CREATE TABLE ${schemaName}.service_package (id UUID PRIMARY KEY, provider_service_id UUID NOT NULL REFERENCES ${schemaName}.provider_service(id), name VARCHAR(240) NOT NULL, amount_minor BIGINT NOT NULL, currency CHAR(3) NOT NULL, active BOOLEAN NOT NULL DEFAULT TRUE, CONSTRAINT package_amount_ck CHECK (amount_minor >= 0));
              CREATE TABLE ${schemaName}.package_feature (id UUID PRIMARY KEY, package_id UUID NOT NULL REFERENCES ${schemaName}.service_package(id), feature_text VARCHAR(500) NOT NULL);
              CREATE TABLE ${schemaName}.portfolio_item (id UUID PRIMARY KEY, provider_id UUID NOT NULL REFERENCES ${schemaName}.provider_profile(id), object_storage_key VARCHAR(500) NOT NULL, caption VARCHAR(500), created_at TIMESTAMP WITH TIME ZONE NOT NULL);
              CREATE TABLE ${schemaName}.review (id UUID PRIMARY KEY, provider_id UUID REFERENCES ${schemaName}.provider_profile(id), venue_id UUID REFERENCES ${schemaName}.venue(id), booking_reference VARCHAR(100) NOT NULL, author_user_id UUID NOT NULL, rating SMALLINT NOT NULL, body TEXT NOT NULL, moderation_state VARCHAR(30) NOT NULL, created_at TIMESTAMP WITH TIME ZONE NOT NULL, CONSTRAINT review_rating_ck CHECK (rating BETWEEN 1 AND 5), CONSTRAINT review_target_ck CHECK ((provider_id IS NOT NULL) <> (venue_id IS NOT NULL)), UNIQUE (booking_reference, provider_id, venue_id));
              CREATE TABLE ${schemaName}.review_reply (id UUID PRIMARY KEY, review_id UUID NOT NULL UNIQUE REFERENCES ${schemaName}.review(id), author_organization_id UUID NOT NULL, body TEXT NOT NULL, created_at TIMESTAMP WITH TIME ZONE NOT NULL);
              CREATE TABLE ${schemaName}.catalog_attribute_definition (id UUID PRIMARY KEY, entity_type VARCHAR(40) NOT NULL, attribute_key VARCHAR(80) NOT NULL, UNIQUE (entity_type, attribute_key));
              CREATE TABLE ${schemaName}.catalog_attribute_value (id UUID PRIMARY KEY, definition_id UUID NOT NULL REFERENCES ${schemaName}.catalog_attribute_definition(id), entity_id UUID NOT NULL, value JSONB NOT NULL, UNIQUE (definition_id, entity_id));
