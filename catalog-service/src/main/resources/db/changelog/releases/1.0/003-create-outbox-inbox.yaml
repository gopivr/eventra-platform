databaseChangeLog:
  - changeSet:
      id: catalog-1.0-003-outbox-inbox
      author: eventra
      changes:
        - sql:
            sql: |
              CREATE TABLE ${schemaName}.outbox_event (id UUID PRIMARY KEY, aggregate_type VARCHAR(100) NOT NULL, aggregate_id VARCHAR(100) NOT NULL, event_type VARCHAR(200) NOT NULL, event_version INTEGER NOT NULL, payload JSONB NOT NULL, occurred_at TIMESTAMP WITH TIME ZONE NOT NULL, published_at TIMESTAMP WITH TIME ZONE, retry_count INTEGER NOT NULL DEFAULT 0, last_error VARCHAR(2000));
              CREATE TABLE ${schemaName}.inbox_message (message_id VARCHAR(200) NOT NULL, consumer_name VARCHAR(200) NOT NULL, received_at TIMESTAMP WITH TIME ZONE NOT NULL, processed_at TIMESTAMP WITH TIME ZONE, status VARCHAR(30) NOT NULL, error_message VARCHAR(2000), PRIMARY KEY (message_id, consumer_name));
