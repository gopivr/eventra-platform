databaseChangeLog:
  - changeSet:
      id: identity-1.0-001-core
      author: eventra
      changes:
        - sql:
            sql: |
              CREATE TABLE ${schemaName}.user_account (id UUID PRIMARY KEY, subject VARCHAR(255) NOT NULL UNIQUE, email_display VARCHAR(320) NOT NULL, email_normalized VARCHAR(320) NOT NULL UNIQUE, phone_e164 VARCHAR(20), status VARCHAR(30) NOT NULL, created_at TIMESTAMP WITH TIME ZONE NOT NULL, updated_at TIMESTAMP WITH TIME ZONE NOT NULL, version BIGINT NOT NULL DEFAULT 0, CONSTRAINT user_account_status_ck CHECK (status IN ('ACTIVE','SUSPENDED','DELETED')));
              CREATE TABLE ${schemaName}.user_identity (id UUID PRIMARY KEY, user_id UUID NOT NULL REFERENCES ${schemaName}.user_account(id), provider VARCHAR(80) NOT NULL, provider_subject VARCHAR(255) NOT NULL, created_at TIMESTAMP WITH TIME ZONE NOT NULL, UNIQUE (provider, provider_subject));
              CREATE TABLE ${schemaName}.role (id UUID PRIMARY KEY, code VARCHAR(80) NOT NULL UNIQUE, display_name VARCHAR(120) NOT NULL);
              CREATE TABLE ${schemaName}.permission (id UUID PRIMARY KEY, code VARCHAR(120) NOT NULL UNIQUE, display_name VARCHAR(160) NOT NULL);
              CREATE TABLE ${schemaName}.role_permission (role_id UUID NOT NULL REFERENCES ${schemaName}.role(id), permission_id UUID NOT NULL REFERENCES ${schemaName}.permission(id), PRIMARY KEY (role_id, permission_id));
              CREATE TABLE ${schemaName}.user_role (user_id UUID NOT NULL REFERENCES ${schemaName}.user_account(id), role_id UUID NOT NULL REFERENCES ${schemaName}.role(id), assigned_at TIMESTAMP WITH TIME ZONE NOT NULL, assigned_by VARCHAR(255), PRIMARY KEY (user_id, role_id));
              CREATE TABLE ${schemaName}.organization (id UUID PRIMARY KEY, name VARCHAR(200) NOT NULL, status VARCHAR(30) NOT NULL, created_by UUID NOT NULL REFERENCES ${schemaName}.user_account(id), created_at TIMESTAMP WITH TIME ZONE NOT NULL, updated_at TIMESTAMP WITH TIME ZONE NOT NULL, CONSTRAINT organization_status_ck CHECK (status IN ('ACTIVE','SUSPENDED','CLOSED')));
              CREATE TABLE ${schemaName}.organization_member (organization_id UUID NOT NULL REFERENCES ${schemaName}.organization(id), user_id UUID NOT NULL REFERENCES ${schemaName}.user_account(id), membership_role VARCHAR(40) NOT NULL, joined_at TIMESTAMP WITH TIME ZONE NOT NULL, PRIMARY KEY (organization_id, user_id));
              CREATE TABLE ${schemaName}.address (id UUID PRIMARY KEY, user_id UUID NOT NULL REFERENCES ${schemaName}.user_account(id), organization_id UUID REFERENCES ${schemaName}.organization(id), address_type VARCHAR(30) NOT NULL, line1 VARCHAR(200) NOT NULL, line2 VARCHAR(200), city VARCHAR(100) NOT NULL, region VARCHAR(100), postal_code VARCHAR(30) NOT NULL, country_code CHAR(2) NOT NULL, created_at TIMESTAMP WITH TIME ZONE NOT NULL);
              CREATE TABLE ${schemaName}.user_preference (user_id UUID PRIMARY KEY REFERENCES ${schemaName}.user_account(id), locale VARCHAR(20) NOT NULL DEFAULT 'en-IN', timezone VARCHAR(100) NOT NULL DEFAULT 'UTC', marketing_email BOOLEAN NOT NULL DEFAULT FALSE, marketing_sms BOOLEAN NOT NULL DEFAULT FALSE, updated_at TIMESTAMP WITH TIME ZONE NOT NULL);
              CREATE TABLE ${schemaName}.verification_case (id UUID PRIMARY KEY, user_id UUID NOT NULL REFERENCES ${schemaName}.user_account(id), case_type VARCHAR(40) NOT NULL, status VARCHAR(30) NOT NULL, provider_case_reference VARCHAR(255), submitted_at TIMESTAMP WITH TIME ZONE, reviewed_at TIMESTAMP WITH TIME ZONE, created_at TIMESTAMP WITH TIME ZONE NOT NULL, CONSTRAINT verification_status_ck CHECK (status IN ('DRAFT','SUBMITTED','IN_REVIEW','APPROVED','REJECTED','EXPIRED')));
              CREATE TABLE ${schemaName}.verification_document_reference (id UUID PRIMARY KEY, case_id UUID NOT NULL REFERENCES ${schemaName}.verification_case(id), object_storage_key VARCHAR(500) NOT NULL, document_type VARCHAR(40) NOT NULL, content_type VARCHAR(100) NOT NULL, created_at TIMESTAMP WITH TIME ZONE NOT NULL);
              CREATE TABLE ${schemaName}.bank_account_reference (id UUID PRIMARY KEY, user_id UUID REFERENCES ${schemaName}.user_account(id), organization_id UUID REFERENCES ${schemaName}.organization(id), provider_token VARCHAR(500) NOT NULL, masked_account VARCHAR(32) NOT NULL, status VARCHAR(30) NOT NULL, created_at TIMESTAMP WITH TIME ZONE NOT NULL, CONSTRAINT bank_owner_ck CHECK (user_id IS NOT NULL OR organization_id IS NOT NULL));
              CREATE TABLE ${schemaName}.audit_event (id UUID PRIMARY KEY, actor_subject VARCHAR(255), action VARCHAR(120) NOT NULL, resource_type VARCHAR(100) NOT NULL, resource_id VARCHAR(100) NOT NULL, metadata JSONB NOT NULL DEFAULT '{}'::jsonb, occurred_at TIMESTAMP WITH TIME ZONE NOT NULL);
