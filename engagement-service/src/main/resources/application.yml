spring:
  application.name: engagement-service
  jpa.hibernate.ddl-auto: validate
  datasource.url: ${ENGAGEMENT_DB_URL:jdbc:postgresql://localhost:5432/eventra}
  datasource.username: ${POSTGRES_USER:eventra}
  datasource.password: ${POSTGRES_PASSWORD:eventra_local_only}
  liquibase.change-log: classpath:db/changelog/db.changelog-master.yaml
  kafka.bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  security.oauth2.resourceserver.jwt.issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/eventra}
server.port: ${SERVER_PORT:8085}
management.endpoints.web.exposure.include: health,info
